<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Caddy shows this while the service is down or starting. The script below asks the service's API
     every few seconds, the last of it to answer quickly as it starts, and reloads once it does;
     without scripts, the page reloads itself every half minute. -->
<noscript><meta http-equiv="refresh" content="30"></noscript>
<title>Back in a moment</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #1b1b1f; color: rgba(255, 255, 245, 0.86);
    font: 18px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  }
  main { text-align: center; padding: 2rem; }
  img { width: min(256px, 60vw); height: auto; animation: drift 6s ease-in-out infinite; }
  h1 { margin: 1.5rem 0 0.5rem; font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 600; }
  p { margin: 0; color: rgba(235, 235, 245, 0.6); font-size: 1rem; }
  @keyframes drift { 50% { transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body><main>
  <img src="/_down/logo.png" alt="">
  <h1>Back in a moment</h1>
  <p>This page reloads itself when the knowledge base is up again.</p>
</main>
<script>
  // 502 to 504 come from Caddy while the service is down; any other answer (401 signed out) means it is up.
  const check = async () => {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' })
      if (r.status < 502 || r.status > 504) return location.reload()
    } catch (e) {}
    setTimeout(check, 3000)
  }
  setTimeout(check, 3000)
</script>
</body>
</html>
